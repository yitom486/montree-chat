name: test
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint:ext
      - run: bun run test -- --maxWorkers=2
        env:
          CHAT_PERF_BUDGET_MS: '6000'
      - run: bun run build
